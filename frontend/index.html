<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevOpsMentor AI</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="shell">
<header><p class="eyebrow">PERSONAL DEVOPS COACH</p><h1>DevOpsMentor AI</h1>
<p class="muted">Think like an engineer. Prepare like you're on call.</p></header>

<section id="setup" class="card">
<h2>Start an interview</h2>
<label>Topic</label>
<select id="topic"><option value="aws-vpc">AWS Networking / VPC</option></select>
<label>Difficulty</label>
<select id="difficulty"><option>beginner</option><option selected>intermediate</option><option>advanced</option></select>
<button id="start">Start interview</button>
</section>

<section id="interview" class="hidden">
<div class="statusbar"><span id="progress"></span><span id="liveScore"></span></div>
<div id="chat" class="chat"></div>
<form id="answerForm" class="card">
<textarea id="answer" rows="7" placeholder="Explain your reasoning as if you're in the interview..." required></textarea>
<button type="submit">Submit answer</button>
</form>
</section>

<section id="report" class="card hidden"></section>
</main>
<script src="/app.js"></script>
</body></html>
